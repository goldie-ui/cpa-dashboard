<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<title>회계사 시험 준비 대시보드</title>
<style>
  :root{
    --bg:#eef0ec; --surface:#ffffff; --surface-2:#f6f7f4;
    --ink:#171b21; --ink-soft:#5b6268; --ink-faint:#8a9088;
    --line:#dfe2dc; --line-strong:#c9cec4;
    --accent:#1c6b48; --accent-soft:rgba(28,107,72,.10); --accent-line:rgba(28,107,72,.35);
    --gold:#a9791f;
    --shadow:0 1px 2px rgba(20,24,26,.04), 0 8px 24px -12px rgba(20,24,26,.18);
    --radius:11px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1311; --surface:#171b18; --surface-2:#1e231f;
      --ink:#e8ece6; --ink-soft:#99a29a; --ink-faint:#6f776f;
      --line:#2a302b; --line-strong:#3a423b;
      --accent:#4bbe86; --accent-soft:rgba(75,190,134,.13); --accent-line:rgba(75,190,134,.4);
      --gold:#d6a848;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --bg:#eef0ec; --surface:#ffffff; --surface-2:#f6f7f4;
    --ink:#171b21; --ink-soft:#5b6268; --ink-faint:#8a9088;
    --line:#dfe2dc; --line-strong:#c9cec4;
    --accent:#1c6b48; --accent-soft:rgba(28,107,72,.10); --accent-line:rgba(28,107,72,.35);
    --gold:#a9791f;
    --shadow:0 1px 2px rgba(20,24,26,.04), 0 8px 24px -12px rgba(20,24,26,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0f1311; --surface:#171b18; --surface-2:#1e231f;
    --ink:#e8ece6; --ink-soft:#99a29a; --ink-faint:#6f776f;
    --line:#2a302b; --line-strong:#3a423b;
    --accent:#4bbe86; --accent-soft:rgba(75,190,134,.13); --accent-line:rgba(75,190,134,.4);
    --gold:#d6a848;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,32px) 72px;}

  /* Header */
  header.top{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;
    padding-bottom:20px;border-bottom:2px solid var(--ink);position:relative;}
  header.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--line-strong);}
  .brand .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);margin:0 0 8px;font-weight:600;}
  .brand h1{margin:0;font-size:clamp(24px,4.2vw,34px);font-weight:700;letter-spacing:-.02em;text-wrap:balance;}
  .brand p{margin:6px 0 0;color:var(--ink-soft);font-size:14px;}

  /* D-day */
  .dday{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;min-width:186px;box-shadow:var(--shadow);}
  .dday .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);display:block;}
  .dday .num{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    line-height:1.1;margin:2px 0 2px;}
  .dday .num.set{color:var(--accent);}
  .dday input[type=date]{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:7px;padding:5px 8px;font-family:var(--font-mono);font-size:12px;
    color-scheme:light dark;}
  .dday .cap{font-size:11px;color:var(--ink-faint);margin-top:5px;}

  /* Toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 8px;}
  .search{flex:1;min-width:220px;position:relative;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;
    stroke:var(--ink-faint);pointer-events:none;}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);border-radius:10px;font-size:15px;font-family:var(--font-sans);box-shadow:var(--shadow);}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .count{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);white-space:nowrap;
    font-variant-numeric:tabular-nums;}

  /* Sections */
  section{margin-top:34px;}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
  .sec-head .idx{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600;
    font-variant-numeric:tabular-nums;}
  .sec-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em;}
  .sec-head .rule{flex:1;height:1px;background:var(--line);}
  .sec-head .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;}

  .tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px 13px;transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;
    display:flex;flex-direction:column;gap:7px;min-height:96px;}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent-line);box-shadow:var(--shadow);}
  .tile:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tile .name{font-size:15.5px;font-weight:650;letter-spacing:-.01em;padding-right:26px;}
  .tile a.link{color:inherit;text-decoration:none;}
  .tile a.link::after{content:"";position:absolute;inset:0;border-radius:var(--radius);}
  .tile a.link:focus{outline:none;}
  .tile .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.45;flex:1;}
  .tile .foot{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;
    color:var(--ink-faint);letter-spacing:.01em;}
  .tile .foot .dom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:1px 5px;flex-shrink:0;opacity:.85;}

  .pin{position:absolute;top:11px;right:10px;z-index:2;width:24px;height:24px;border:none;background:none;
    cursor:pointer;color:var(--ink-faint);display:grid;place-items:center;border-radius:6px;padding:0;
    transition:color .12s ease,background .12s ease;}
  .pin:hover{color:var(--gold);background:var(--surface-2);}
  .pin.on{color:var(--gold);}
  .pin svg{width:16px;height:16px;}
  .pin:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .empty{display:none;text-align:center;color:var(--ink-faint);font-size:14px;padding:40px 0;}

  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--ink-faint);}
  footer .priv{display:inline-flex;align-items:center;gap:6px;}
  footer .priv svg{width:13px;height:13px;stroke:var(--ink-faint);}

  @media (max-width:520px){
    header.top{align-items:stretch}
    .dday{min-width:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">CPA · 회계사 시험 준비</p>
      <h1>나의 스터디 대시보드</h1>
      <p>자주 쓰는 사이트를 한 곳에서 · 카드를 누르면 새 탭으로 이동</p>
    </div>
    <div class="dday">
      <span class="lbl">시험일까지</span>
      <div class="num" id="ddayNum">D-day 설정 →</div>
      <input type="date" id="ddayInput" aria-label="목표 시험일">
      <div class="cap" id="ddayCap">목표 시험일을 정해보세요</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="사이트 검색 (예: 재무회계, 홈택스, 나무)" autocomplete="off" aria-label="사이트 검색">
    </div>
    <span class="count" id="count"></span>
  </div>

  <div id="pinnedSec"></div>
  <div id="sections"></div>
  <div class="empty" id="empty">검색 결과가 없어요.</div>

  <footer>
    <span class="priv">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      나만 보는 비공개 페이지 · 즐겨찾기(⭐)와 시험일은 이 브라우저에 저장돼요
    </span>
    <span>필요한 사이트는 언제든 추가·수정 요청하세요</span>
  </footer>
</div>

<script>
  // ── 사이트 목록: 여기만 고치면 대시보드가 바뀝니다 ──────────────
  // {name, url, desc, tag?}  tag는 "확인 필요" 같은 배지 (선택)
  const DATA = [
    { title:"시험 · 공시 · 법령", items:[
      {name:"금감원 CPA 시험", url:"https://cpa.fss.or.kr", desc:"원서접수 · 시험공고 · 합격자 발표"},
      {name:"DART 전자공시", url:"https://dart.fss.or.kr", desc:"상장사 재무제표 · 사업보고서 조회"},
      {name:"한국회계기준원", url:"https://www.kasb.or.kr", desc:"K-IFRS 기준서 · 해석 원문"},
      {name:"국가법령정보센터", url:"https://www.law.go.kr", desc:"세법 · 상법 조문 원문 검색"},
    ]},
    { title:"인강 · 학원", items:[
      {name:"나무경영아카데미", url:"https://www.namucpa.com", desc:"공인회계사 · 세무사 인강"},
      {name:"우리경영아카데미", url:"https://www.uricpa.com", desc:"공인회계사 · 세무사 인강"},
      {name:"스마트경영아카데미", url:"https://www.smartcpa.kr", desc:"공인회계사 · 세무사 인강"},
    ]},
    { title:"교재 · 서점", items:[
      {name:"늘벗서점", url:"https://nbcpa.co.kr/shop/", desc:"CPA · 세무사 수험서 전문 서점"},
    ]},
    { title:"커뮤니티 · 카페", items:[
      {name:"회계동아리", url:"https://cafe.daum.net/account2000", desc:"수험 정보 · 후기 (Daum 카페)"},
      {name:"KDianS · 김기동 재무회계", url:"https://cafe.daum.net/KDianS", desc:"재무회계 수험상담 (Daum 카페)"},
      {name:"독회사 (독하게 회계사)", url:"https://cafe.naver.com/dokhoe", desc:"수험생 커뮤니티 (네이버 카페)"},
    ]},
  ];
  // ──────────────────────────────────────────────────────────────

  const LS_PIN="cpa_dash_pins_v1", LS_DDAY="cpa_dash_dday_v1";
  const $=s=>document.querySelector(s);
  const domain=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}};
  const key=it=>it.url;
  let pins=new Set(JSON.parse(localStorage.getItem(LS_PIN)||"[]"));
  const savePins=()=>localStorage.setItem(LS_PIN,JSON.stringify([...pins]));

  const starSVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.6 1-5.8L3.5 9.7l5.9-.9z"/></svg>`;
  const starFill=`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.6 1-5.8L3.5 9.7l5.9-.9z"/></svg>`;

  function tileHTML(it){
    const on=pins.has(key(it));
    return `<div class="tile" data-search="${(it.name+' '+it.desc+' '+domain(it.url)).toLowerCase()}">
      <button class="pin ${on?'on':''}" data-key="${it.url.replace(/"/g,'&quot;')}"
        aria-pressed="${on}" title="${on?'즐겨찾기 해제':'즐겨찾기'}">${on?starFill:starSVG}</button>
      <div class="name"><a class="link" href="${it.url}" target="_blank" rel="noopener noreferrer">${it.name}</a></div>
      <div class="desc">${it.desc||""}</div>
      <div class="foot"><span class="dom">${domain(it.url)}</span>${it.tag?`<span class="tag">${it.tag}</span>`:""}</div>
    </div>`;
  }

  function render(){
    const q=($("#q").value||"").trim().toLowerCase();
    const all=DATA.flatMap(s=>s.items);
    const match=it=>!q||(it.name+' '+it.desc+' '+domain(it.url)).toLowerCase().includes(q);

    // pinned
    const pinned=all.filter(it=>pins.has(key(it))&&match(it));
    $("#pinnedSec").innerHTML = pinned.length ? `<section>
      <div class="sec-head"><span class="idx">★</span><h2>즐겨찾기</h2><span class="rule"></span><span class="n">${pinned.length}</span></div>
      <div class="grid">${pinned.map(tileHTML).join("")}</div></section>` : "";

    // sections
    let shown=0;
    $("#sections").innerHTML = DATA.map((sec,i)=>{
      const items=sec.items.filter(match);
      shown+=items.length;
      if(!items.length) return "";
      const idx=String(i+1).padStart(2,"0");
      return `<section>
        <div class="sec-head"><span class="idx">${idx}</span><h2>${sec.title}</h2><span class="rule"></span><span class="n">${items.length}</span></div>
        <div class="grid">${items.map(tileHTML).join("")}</div></section>`;
    }).join("");

    $("#empty").style.display = shown ? "none":"block";
    $("#count").textContent = q ? `${shown} / ${all.length}개` : `${all.length}개 사이트`;
  }

  // events
  document.addEventListener("click",e=>{
    const b=e.target.closest(".pin"); if(!b) return;
    e.preventDefault();
    const k=b.dataset.key;
    if(pins.has(k)) pins.delete(k); else pins.add(k);
    savePins(); render();
  });
  $("#q").addEventListener("input",render);

  // D-day
  function refreshDday(){
    const v=localStorage.getItem(LS_DDAY);
    const numEl=$("#ddayNum"), capEl=$("#ddayCap"), inp=$("#ddayInput");
    if(!v){numEl.textContent="D-day 설정 →";numEl.classList.remove("set");capEl.textContent="목표 시험일을 정해보세요";return;}
    inp.value=v;
    const t=new Date(v+"T00:00:00"), now=new Date(); now.setHours(0,0,0,0);
    const diff=Math.round((t-now)/86400000);
    numEl.classList.add("set");
    numEl.textContent = diff>0?`D-${diff}` : diff===0?"D-DAY":`D+${-diff}`;
    const d=new Date(v+"T00:00:00");
    capEl.textContent = d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})+" 목표";
  }
  $("#ddayInput").addEventListener("change",e=>{
    if(e.target.value) localStorage.setItem(LS_DDAY,e.target.value);
    else localStorage.removeItem(LS_DDAY);
    refreshDday();
  });
  $("#ddayNum").addEventListener("click",()=>$("#ddayInput").showPicker?.()||$("#ddayInput").focus());

  render(); refreshDday();
</script>
</body>
</html>
